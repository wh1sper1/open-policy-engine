name: Citation & Taxonomy Linter

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'dossiers/**'
      - 'vectors/**'
      - 'pipeline/linters/**'

jobs:
  lint-citations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python pipeline/linters/citation_check.py
